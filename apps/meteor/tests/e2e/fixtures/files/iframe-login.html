<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Iframe Login</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%2300b4d8' d='M52 24c-6-8-18-10-28-4-5 3-9 8-12 12-4-3-8-5-10-4 2 4 2 8 0 12 2 1 6-1 10-4 3 4 7 9 12 12 10 6 22 4 28-4 4-5 4-15 0-20z'/%3E%3Ccircle cx='44' cy='30' r='3' fill='%23fff'/%3E%3C/svg%3E">
</head>
<script>
	function login() {
		console.log('logging in');
		window.parent.postMessage({
			event: 'login-with-token',
			loginToken: 'REPLACE_WITH_TOKEN',
		}, '*');
	}

	window.addEventListener('message', (event) => {
		if(event.data.event === 'login-error') {
			document.getElementById('login-error').innerText = "Login failed";
		}
	});
</script>
<body>
    <h1>Iframe Authentication Login Form</h1>
    <form id="login-form">
        <label for="username">Username:</label><br/>
        <input type="text" id="username" name="username" placeholder="Enter username" /><br/><br/>

        <label for="password">Password:</label><br/>
        <input type="password" id="password" name="password" placeholder="Enter password" /><br/><br/>

        <button id="submit" type="button"

		onclick="login()">Login</button>
    </form>
	<div id="login-error"></div>
</body>
</html>
